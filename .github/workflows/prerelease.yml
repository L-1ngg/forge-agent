name: Draft prerelease

on:
  workflow_dispatch:
    inputs:
      version:
        description: Unique source snapshot tag (vX.Y.Z-alpha.N)
        required: true
        type: string
      target_sha:
        description: Full 40-character commit SHA from master history
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: source-prerelease
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  TARGET_SHA: ${{ inputs.target_sha }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12
      - run: bun scripts/release-policy.ts
        env:
          GH_TOKEN: ${{ github.token }}

  verify:
    needs: validate
    uses: ./.github/workflows/verify.yml
    with:
      target: ${{ inputs.target_sha }}

  publish:
    name: Create draft after verification
    needs: [validate, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12
      - name: Recheck target and version
        run: bun scripts/release-policy.ts
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Archive verified source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/forge-agent-release"
          cd "$RUNNER_TEMP/forge-agent-release"
          git -C "$GITHUB_WORKSPACE" archive --format=tar --prefix="forge-agent-$RELEASE_VERSION/" "$TARGET_SHA" | gzip -n > "forge-agent-$RELEASE_VERSION.tar.gz"
          sha256sum "forge-agent-$RELEASE_VERSION.tar.gz" > SHA256SUMS
          bun "$GITHUB_WORKSPACE/scripts/release-notes.ts"
      - name: Create draft prerelease
        working-directory: ${{ runner.temp }}/forge-agent-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RELEASE_VERSION"
          "forge-agent-$RELEASE_VERSION.tar.gz" SHA256SUMS
          --repo "$GITHUB_REPOSITORY" --target "$TARGET_SHA"
          --title "Forge Agent $RELEASE_VERSION"
          --draft --prerelease --latest=false --notes-file RELEASE_NOTES.md

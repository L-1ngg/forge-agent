name: Feature request
description: Describe a task Forge Agent should support.
body:
  - type: textarea
    id: task
    attributes:
      label: Task and current limitation
      description: Who needs this and what are they trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: Describe observable success and any constraints.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
